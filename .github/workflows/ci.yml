name: Dispatch Validation CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  # --------------------------------------------------
  # Job 1: Deterministic automated tests
  # --------------------------------------------------
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest anthropic python-dotenv

      - name: Run unit tests
        run: |
          PYTHONPATH=. pytest


  # --------------------------------------------------
  # Job 2: LLM-as-a-Judge evaluation
  # --------------------------------------------------
  llm-evaluation:
    runs-on: ubuntu-latest
    needs: test

    # Only run Claude evaluation on main pushes
    # or when manually triggered.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic python-dotenv

      - name: Run LLM evaluation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          PYTHONPATH=. python -m judge.evaluate

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-evaluation-results
          path: dispatch_evaluation_results.json